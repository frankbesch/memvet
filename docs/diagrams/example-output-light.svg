<svg viewBox="0 0 360 294" xmlns="http://www.w3.org/2000/svg" role="img" font-family='ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>memvet check examples/broken</title>
<desc>memvet check examples/broken prints two findings. pointers RED MEMORY.md:6 dead reference: memory/preferences.md does not exist [pointers/dead-ref]. tokens YELLOW memory/acme.md 794 estimated tokens exceeds budget of 400 [tokens/over-budget]. Then the docs link and the summary: 1 red, 1 yellow, tree a5e8a264f658.</desc>
<rect width="360" height="294" rx="6" fill="#FCFBF9"/>
<text x="16" y="30" font-size="15" fill="#2B2926" font-weight="600">The 60-second example</text>
<line x1="16" y1="42" x2="344" y2="42" stroke="#D2CCC3"/>
<text x="20" y="60" font-size="12" fill="#2B2926">$ memvet check examples/broken</text>
<text x="20" y="79" font-size="12" fill="#2B2926">pointers</text>
<text x="92" y="79" font-size="12" fill="#90302B" font-weight="600">RED</text>
<text x="149.6" y="79" font-size="12" fill="#2B2926">MEMORY.md:6</text>
<text x="48.8" y="98" font-size="12" fill="#6A625A">dead reference: memory/preferences.md</text>
<text x="48.8" y="117" font-size="12" fill="#6A625A">does not exist [pointers/dead-ref]</text>
<text x="20" y="136" font-size="12" fill="#2B2926">tokens</text>
<text x="92" y="136" font-size="12" fill="#916A0B" font-weight="600">YELLOW</text>
<text x="149.6" y="136" font-size="12" fill="#2B2926">memory/acme.md</text>
<text x="48.8" y="155" font-size="12" fill="#6A625A">794 estimated tokens exceeds budget of</text>
<text x="48.8" y="174" font-size="12" fill="#6A625A">400 [tokens/over-budget]</text>
<text x="20" y="193" font-size="12" fill="#6A625A">docs: https://github.com/frankbesch/</text>
<text x="48.8" y="212" font-size="12" fill="#6A625A">memvet/blob/main/docs/findings.md</text>
<text x="20" y="231" font-size="12" fill="#2B2926">memvet: 1 red, 1 yellow (tree a5e8a264f658)</text>
<text x="16" y="258" font-size="12" fill="#6A625A">RED fails the run. YELLOW fails it only with</text>
<text x="16" y="275" font-size="12" fill="#6A625A">--strict.</text>
</svg>
