<svg viewBox="0 0 360 636" xmlns="http://www.w3.org/2000/svg" role="img" font-family='ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>Gating a push on memvet</title>
<desc>A gate script runs memvet check --strict; RED means exit 1 and stop. On a clean run it runs memvet fingerprint and writes a marker, .git/push-ok, naming the checks passed, the time, and the tree. On git push origin main the pre-push hook reads the marker and fingerprints the tree again. A marker under 10 minutes old with a matching tree allows one plain push and is consumed. Anything else, a stale marker, a moved tree, or a push that is not plain, asks a human.</desc>
<rect width="360" height="636" rx="6" fill="#0E1C2B"/>
<text x="16" y="30" font-size="15" fill="#E8E2D6" font-weight="600">Gating a push on memvet</text>
<line x1="16" y1="42" x2="344" y2="42" stroke="#2D4152"/>
<rect x="16" y="54" width="328" height="46" rx="4" fill="#1F3142" stroke="#6DA361"/>
<text x="30" y="73" font-size="13" fill="#E8E2D6" font-weight="600">Gate script: memvet check --strict</text>
<text x="30" y="91" font-size="12" fill="#A8A296">RED means exit 1 and stop</text>
<path d="M40 104 L40 137" fill="none" stroke="#A8A296" stroke-width="1.5"/><polygon points="35,129 45,129 40,137" fill="#A8A296"/>
<text x="58" y="125" font-size="12" fill="#A8A296">clean, exit 0</text>
<rect x="16" y="141" width="328" height="46" rx="4" fill="#1F3142" stroke="#2D4152"/>
<text x="30" y="160" font-size="13" fill="#E8E2D6" font-weight="600">memvet fingerprint</text>
<text x="30" y="178" font-size="12" fill="#A8A296">tree a5e8a264f658</text>
<path d="M40 191 L40 224" fill="none" stroke="#A8A296" stroke-width="1.5"/><polygon points="35,216 45,216 40,224" fill="#A8A296"/>
<text x="58" y="212" font-size="12" fill="#A8A296">tree hash</text>
<rect x="16" y="228" width="328" height="46" rx="4" fill="#1F3142" stroke="#2D4152"/>
<text x="30" y="247" font-size="13" fill="#E8E2D6" font-weight="600">Marker written: .git/push-ok</text>
<text x="30" y="265" font-size="12" fill="#A8A296">checks passed, time, tree</text>
<path d="M40 278 L40 311" fill="none" stroke="#A8A296" stroke-width="1.5"/><polygon points="35,303 45,303 40,311" fill="#A8A296"/>
<text x="58" y="299" font-size="12" fill="#A8A296">developer or agent pushes</text>
<rect x="16" y="315" width="328" height="46" rx="4" fill="#1F3142" stroke="#2D4152"/>
<text x="30" y="334" font-size="13" fill="#E8E2D6" font-weight="600">git push origin main</text>
<text x="30" y="352" font-size="12" fill="#A8A296">the pre-push hook reads the marker</text>
<path d="M40 365 L40 398" fill="none" stroke="#A8A296" stroke-width="1.5"/><polygon points="35,390 45,390 40,398" fill="#A8A296"/>
<text x="58" y="386" font-size="12" fill="#A8A296">marker found</text>
<rect x="16" y="402" width="328" height="46" rx="4" fill="#1F3142" stroke="#2D4152"/>
<text x="30" y="421" font-size="13" fill="#E8E2D6" font-weight="600">Fingerprint the tree again</text>
<text x="30" y="439" font-size="12" fill="#A8A296">marker under 10 min, same tree?</text>
<path d="M94 448 L94 488" fill="none" stroke="#6DA361" stroke-width="2"/><polygon points="89,480 99,480 94,488" fill="#6DA361"/>
<rect x="100.0" y="459" width="31.6" height="18" rx="3" fill="#0E1C2B"/><text x="104" y="472" font-size="12" fill="#6DA361">yes</text>
<path d="M266 448 L266 488" fill="none" stroke="#D17276" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="261,480 271,480 266,488" fill="#D17276"/>
<rect x="272.0" y="459" width="24.4" height="18" rx="3" fill="#0E1C2B"/><text x="276" y="472" font-size="12" fill="#D17276">no</text>
<rect x="16" y="488" width="156" height="86" rx="5" fill="#1F3142" stroke="#6DA361" stroke-width="1.5"/>
<text x="94" y="511" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">Push allowed</text>
<text x="94" y="529" font-size="12" fill="#A8A296" text-anchor="middle">one plain push;</text>
<text x="94" y="545" font-size="12" fill="#A8A296" text-anchor="middle">marker consumed</text>
<text x="94" y="561" font-size="12" fill="#6DA361" text-anchor="middle">origin/main</text>
<rect x="188" y="488" width="156" height="86" rx="5" fill="#1F3142" stroke="#D17276" stroke-width="1.5"/>
<text x="266" y="511" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">Ask a human</text>
<text x="266" y="529" font-size="12" fill="#A8A296" text-anchor="middle">stale marker, moved</text>
<text x="266" y="545" font-size="12" fill="#A8A296" text-anchor="middle">tree, or not a</text>
<text x="266" y="561" font-size="12" fill="#A8A296" text-anchor="middle">plain push</text>
<text x="16" y="602" font-size="12" fill="#A8A296">memvet stores nothing; the gate script keeps</text>
<text x="16" y="619" font-size="12" fill="#A8A296">the receipt.</text>
</svg>
