<svg viewBox="0 0 360 277" xmlns="http://www.w3.org/2000/svg" role="img" font-family='"QuoinMono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>examples/broken/.memvet.toml</title>
<desc>The config of examples/broken declares two rules. pointers: files MEMORY.md, roots memory. tokens: watch MEMORY.md and memory/*.md, budget 400.</desc>
<style>@font-face{font-family:"QuoinMono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="360" height="277" rx="6" fill="#FCFBF9"/>
<text x="16" y="30" font-size="15" fill="#2B2926" font-weight="600" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>Its config</text>
<line x1="16" y1="42" x2="344" y2="42" stroke="#D2CCC3"/>
<text x="20" y="60" font-size="12" fill="#6A625A">examples/broken/.memvet.toml</text>
<text x="20" y="84" font-size="12" fill="#2B2926">[pointers]</text>
<text x="20" y="108" font-size="12" fill="#2B2926">files = [&quot;MEMORY.md&quot;]</text>
<text x="20" y="132" font-size="12" fill="#2B2926">roots = [&quot;memory&quot;]</text>
<text x="20" y="180" font-size="12" fill="#2B2926">[tokens]</text>
<text x="20" y="204" font-size="12" fill="#2B2926">watch = [&quot;MEMORY.md&quot;, &quot;memory/*.md&quot;]</text>
<text x="20" y="228" font-size="12" fill="#2B2926">budget = 400</text>
<text x="16" y="260" font-size="12" fill="#6A625A" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>Two rules. Each finding in the run names its rule.</text>
</svg>
